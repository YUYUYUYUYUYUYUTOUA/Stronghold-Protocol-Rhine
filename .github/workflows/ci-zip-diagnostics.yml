name: ZIP fixture diagnostics

on:
  push:
    branches: [codex/ci-zip-diagnostics-20261022]
    paths:
      - .github/workflows/ci-zip-diagnostics.yml
      - .github/scripts/ci-zip-diagnostics.mjs

permissions:
  contents: read

jobs:
  zip-fixture:
    name: Original ZIP reader fixture (Windows, Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Original ZIP reader test with passive spawn diagnostics
        shell: pwsh
        env:
          SP_ZIP_DIAG_DIR: ${{ runner.temp }}/rhine-zip-spawn-diag
        run: node --import ./.github/scripts/ci-zip-diagnostics.mjs --test --test-name-pattern="the zip reader" test/update-package.test.js
      - name: Retain original spawn results
        if: always()
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP 'rhine-zip-spawn-diag'
          $reports = @(Get-ChildItem -Path $probeDir -Filter 'zip-spawn-*.json' -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) { throw 'No original ZIP fixture spawn was observed' }
          foreach ($report in $reports) { Get-Content -LiteralPath $report.FullName -Raw }
