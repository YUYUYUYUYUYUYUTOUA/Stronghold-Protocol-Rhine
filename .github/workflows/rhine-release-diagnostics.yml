name: Rhine Release Diagnostics
on:
  push:
    branches: [codex/rhine-upstream-021]
    paths: [.github/workflows/rhine-release-diagnostics.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Export the failed publication and Windows Node 22 checks
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/407541952" > release.json
          python3 - <<'PY'
          import json
          r=json.load(open('release.json'))
          assert r['draft'] is True and r['tag_name']=='v0.2.1-rhine.4'
          PY
          gh run view 37889719566 --repo "$GITHUB_REPOSITORY" --job 113687658042 --log-failed > publication.log
          gh run view 37881662247 --repo "$GITHUB_REPOSITORY" --job 113662492389 --log-failed > node22.log
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          report={}
          for name,file in [('publicationFailure','publication.log'),('windowsNode22Failure','node22.log')]:
              lines=Path(file).read_text().splitlines()
              indices=[i for i,line in enumerate(lines) if re.search(r'Error:|AssertionError|not ok|failing tests|best .*ms/tick|expected:|actual:',line)]
              selected=set()
              for i in indices:
                  selected.update(range(max(0,i-3),min(len(lines),i+12)))
              report[name]=[lines[i] for i in sorted(selected)] or lines[-55:]
          Path('RELEASE-VALIDATION.json').write_text(json.dumps({'diagnosticsOnly':True,**report},ensure_ascii=False,indent=2)+'\n')
          PY
          gh release upload v0.2.1-rhine.4 RELEASE-VALIDATION.json --clobber --repo "$GITHUB_REPOSITORY"
